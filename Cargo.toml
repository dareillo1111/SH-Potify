[package]
name = "sh_potify"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
base64 = "0.22.1"
dotenv = "0.15.0"
once_cell = "1.21.3"
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite"] }
thiserror = "2.0.15"
tokio = { version = "1.47.1", features = ["full", "rt-multi-thread"] }
